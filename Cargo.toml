[package]
name = "onde-code"
version = "1.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Onde Code is Onde Inference's ACP-compatible coding agent for model fine-tuning and deployment."
repository = "https://github.com/kelvin-soen/OndeCode"

[dependencies]
# Onde Agent Platform: the ACP server, terminal UI and MCP layer, from the onde-ed workspace.
ed-acp = "1.2.0"
ed-acp-tui = "1.2.0"
agent-client-protocol = "2.2"
anyhow = "1.0.104"
async-trait = "0.1"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"

[dev-dependencies]
uuid = { version = "1.27.0", features = ["v4"] }

[[bin]]
name = "fake-mcp-server"
path = "src/bin/fake_mcp_server.rs"
