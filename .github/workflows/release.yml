name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The binary reports CARGO_PKG_VERSION in `initialize` and in commit trailers, so a tag that
  # doesn't match Cargo.toml ships the wrong version (v0.4.0 went out reporting 0.3.1).
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, name: darwin-arm64 }
          - { target: x86_64-apple-darwin, os: macos-15-intel, name: darwin-x64 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, name: linux-x64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, name: linux-arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package archive
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/onde-code
          ARCHIVE=onde-code-${{ matrix.name }}
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$ARCHIVE.zip" "$BIN.exe"
            echo "asset=$ARCHIVE.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$ARCHIVE.tar.gz" -C "target/${{ matrix.target }}/release" onde-code
            echo "asset=$ARCHIVE.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the release once (first matrix job wins; others no-op).
          # Tolerate only the already-exists race: a genuinely failed create
          # makes `gh release view` fail too, so the step still fails loudly.
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber

  # One checksums.txt for all archives; the ACP registry entry pins these sha256 values.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Upload checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern 'onde-code-*' --dir dist
          (cd dist && sha256sum onde-code-* > checksums.txt && cat checksums.txt)
          gh release upload "$GITHUB_REF_NAME" dist/checksums.txt --repo "$GITHUB_REPOSITORY" --clobber
